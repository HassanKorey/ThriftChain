<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join {{ circle.name }} | AjoChain</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="background-effects">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>

    <div class="container">
        <header class="hero">
            <img src="/static/logo.png" alt="AjoChain Logo" style="width: 60px; height: 60px; margin-bottom: 0.5rem; border-radius: 50%; box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);">
            <h1>Join Circle</h1>
            <p>You've been invited to join <strong>{{ circle.name }}</strong></p>
            <p class="circle-details">Target: {{ circle.member_count_target }} members | Contribution: ₦{{ circle.contribution_amount }}</p>
        </header>

        <main class="glass-panel">
            <h2>Complete Your Profile</h2>
            <form id="join-circle-form" data-circle-id="{{ circle.id }}">
                <div class="input-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" value="Bunch Dillon" required>
                </div>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" value="bunch.dillon@example.com" required>
                </div>
                <div class="input-group">
                    <label for="phone">Phone Number</label>
                    <input type="text" id="phone" name="phone" value="+2348000000000" required>
                </div>
                
                <h3 style="margin: 1.5rem 0 1rem; font-size: 1.1rem; color: var(--primary);">KYC Information</h3>
                
                <div class="input-group">
                    <label for="bvn">BVN</label>
                    <input type="text" id="bvn" name="bvn" value="95888168924" required>
                </div>
                <div class="input-group">
                    <label for="dob">Date of Birth (YYYY-MM-DD)</label>
                    <input type="text" id="dob" name="dob" value="1990-01-15" required>
                </div>
                <div class="input-group">
                    <label for="gender">Gender</label>
                    <input type="text" id="gender" name="gender" value="male" required>
                </div>
                <div class="input-group">
                    <label for="street">Street Address</label>
                    <input type="text" id="street" name="street" value="15 Admiralty Way" required>
                </div>
                <input type="hidden" id="city" value="Lagos">
                <input type="hidden" id="state" value="Lagos">
                <input type="hidden" id="country" value="NGA">

                <button type="submit" class="btn-primary" id="join-submit-btn">Join Circle & Create Wallet</button>
            </form>

            <div id="join-result" class="hidden">
                <h3>Welcome aboard!</h3>
                <p>Your BMONI wallet has been provisioned.</p>
                <div class="invite-link-box" style="margin-top: 1.5rem;">
                    <a href="/dashboard/{{ circle.id }}" class="btn-primary" style="text-align:center; text-decoration:none;">Go to Dashboard</a>
                </div>
            </div>
        </main>
    </div>
    
    <style>
        .circle-details { color: #34d399; font-weight: 500; margin-top: 0.5rem; }
    </style>
    <script src="/static/app.js"></script>
</body>
</html>
