<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ThriftCircle</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .auth-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .auth-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }
        .auth-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="background-effects">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>
    
    <div class="container">
        <div class="hero">
            <img src="/static/logo.png" alt="ThriftCircle Logo" style="width: 60px; height: 60px; margin-bottom: 0.5rem; border-radius: 50%; box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);">
            <h1>Welcome Back</h1>
            <p>Sign in to your ThriftCircle dashboard</p>
        </div>
        
        <div class="glass-panel">
            <div id="error-message" style="display: none; background: rgba(239, 68, 68, 0.2); color: #ef4444; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; border: 1px solid rgba(239, 68, 68, 0.5);"></div>
            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="john@example.com">
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <div style="position: relative;">
                        <input type="password" id="password" required placeholder="••••••••" style="width: 100%; padding-right: 40px;">
                        <span id="togglePassword" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-muted);" title="Toggle Password Visibility">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </span>
                    </div>
                </div>
                
                <button type="submit" class="btn-primary" id="submitBtn">Sign In</button>
            </form>
            <div class="auth-link">
                Don't have an account? <a href="/register">Create one</a>
            </div>
        </div>
    </div>
    
    <script>
        document.getElementById('togglePassword').addEventListener('click', function (e) {
            const password = document.getElementById('password');
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errorDiv = document.getElementById('error-message');
            
            btn.innerText = 'Signing in...';
            btn.disabled = true;
            errorDiv.style.display = 'none';
            
            const data = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };
            
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                if (res.ok) {
                    window.location.href = '/dashboard';
                } else {
                    const error = await res.json();
                    errorDiv.innerText = error.detail || 'Login failed';
                    errorDiv.style.display = 'block';
                    btn.innerText = 'Sign In';
                    btn.disabled = false;
                }
            } catch (err) {
                errorDiv.innerText = 'Network error occurred';
                errorDiv.style.display = 'block';
                btn.innerText = 'Sign In';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
